name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aliiabdii/pdf-merger

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Run frontend tests
        run: |
          npm ci
          npm run test:js

      - name: Run backend tests
        run: ./gradlew test --no-daemon --console=plain

  publish:
    name: Build and publish image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE_NAME:sha-${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:latest" \
            .

      - name: Publish image
        run: |
          docker push "$IMAGE_NAME:sha-${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: Deploy to Hetzner
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloud

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull image, restart application, and verify health
        env:
          HETZNER_HOST: ${{ vars.HETZNER_HOSTNAME }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" << 'EOF'
              set -eu
              cd /opt/pdf-merger
              docker compose pull pdf-merger
              docker compose up -d --no-deps --force-recreate pdf-merger

              healthy=false
              for attempt in $(seq 1 12); do
                if curl --silent --show-error --fail \
                    --max-time 5 \
                    --output /dev/null \
                    http://localhost:8080/actuator/health; then
                  healthy=true
                  break
                fi
                sleep 5
              done

              if [ "$healthy" = true ]; then
                echo "Service is up!"
              else
                echo "Service failed to become healthy after 12 attempts." >&2
                exit 1
              fi
          EOF
